<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vólei de Praia Arcade</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background-color: #1a1a2e;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border-radius: 12px;
            overflow: hidden;
        }
        canvas {
            display: block;
            background: #87CEEB;
        }
        .ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }
        .scoreboard {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(5px);
            padding: 10px 20px;
            border-radius: 30px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: white;
            font-weight: bold;
            font-size: 24px;
            width: 80%;
            margin: 0 auto;
        }
        .score-box {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .score-val {
            font-size: 36px;
            color: #ffcc00;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        .menu-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            gap: 20px;
        }
        .menu-title {
            font-size: 48px;
            color: #ff9900;
            text-shadow: 3px 3px 0px #d35400, 6px 6px 0px rgba(0,0,0,0.2);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
        }
        .btn {
            background: linear-gradient(135deg, #f39c12, #e67e22);
            border: none;
            color: white;
            padding: 15px 32px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(230, 126, 34, 0.4);
            transition: all 0.2s ease;
            width: 250px;
            text-align: center;
        }
        .btn:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 6px 20px rgba(230, 126, 34, 0.6);
            background: linear-gradient(135deg, #f1c40f, #e67e22);
        }
        .btn:active {
            transform: translateY(1px);
        }
        .controls-info {
            display: flex;
            gap: 40px;
            margin-top: 10px;
            background: rgba(255, 255, 255, 0.1);
            padding: 15px 25px;
            border-radius: 12px;
            font-size: 14px;
        }
        .controls-column {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .controls-column h3 {
            color: #f39c12;
            margin-bottom: 5px;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="900" height="500"></canvas>
        
        <div class="ui-overlay">
            <div class="scoreboard">
                <div class="score-box">
                    <span id="p1-name">Jogador 1</span>
                    <span id="p1-score" class="score-val">0</span>
                </div>
                <div>VS</div>
                <div class="score-box">
                    <span id="p2-score" class="score-val">0</span>
                    <span id="p2-name">CPU</span>
                </div>
            </div>
        </div>

        <!-- Menu Principal -->
        <div id="main-menu" class="menu-screen">
            <h1 class="menu-title">Vólei de Praia<br>Arcade</h1>
            <button class="btn" id="btn-1p">1 Jogador (vs IA)</button>
            <button class="btn" id="btn-2p">2 Jogadores</button>
            
            <div class="controls-info">
                <div class="controls-column">
                    <h3>Jogador 1 (Esquerda)</h3>
                    <p><strong>A / D:</strong> Mover</p>
                    <p><strong>W:</strong> Saltara</p>
                    <p><strong>S:</strong> Remate / Batida Forte</p>
                </div>
                <div class="controls-column">
                    <h3>Jogador 2 (Direita)</h3>
                    <p><strong>Setas Esquerda / Direita:</strong> Mover</p>
                    <p><strong>Seta Cima:</strong> Saltara</p>
                    <p><strong>Seta Baixo:</strong> Remate / Batida Forte</p>
                </div>
            </div>
        </div>

        <!-- Ecrã de Fim de Jogo -->
        <div id="game-over-screen" class="menu-screen hidden">
            <h1 id="winner-title" class="menu-title">Jogador 1 Venceu!</h1>
            <button class="btn" id="btn-restart">Jogar Novamente</button>
            <button class="btn" id="btn-menu">Menu Principal</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // UI Elements
        const mainMenu = document.getElementById('main-menu');
        const gameOverScreen = document.getElementById('game-over-screen');
        const winnerTitle = document.getElementById('winner-title');
        const p1ScoreEl = document.getElementById('p1-score');
        const p2ScoreEl = document.getElementById('p2-score');
        const p2NameEl = document.getElementById('p2-name');

        // Configurações do Jogo
        const GAME_WIDTH = 900;
        const GAME_HEIGHT = 500;
        const GROUND_Y = 420;
        const NET_X = GAME_WIDTH / 2;
        const NET_HEIGHT = 140;
        const NET_TOP = GROUND_Y - NET_HEIGHT;
        const WINNING_SCORE = 15;

        // Estado do Jogo
        let gameMode = '1P'; // '1P' ou '2P'
        let gameState = 'MENU'; // 'MENU', 'PLAYING', 'GAMEOVER'
        let p1Score = 0;
        let p2Score = 0;
        let servingPlayer = 1; // 1 ou 2
        let particles = [];

        // Teclas Pressionadas
        const keys = {};

        window.addEventListener('keydown', (e) => {
            keys[e.code] = true;
        });

        window.addEventListener('keyup', (e) => {
            keys[e.code] = false;
        });

        // Classe Jogador
        class Player {
            constructor(x, color, isAI = false, controls = {}) {
                this.startX = x;
                this.x = x;
                this.y = GROUND_Y;
                this.radius = 25;
                this.color = color;
                this.vx = 0;
                this.vy = 0;
                this.speed = 6.5;
                this.jumpForce = -13.5;
                this.isGrounded = false;
                this.isAI = isAI;
                this.controls = controls;
                this.touches = 0;
                this.eyeOffset = isAI ? -8 : 8;
            }

            reset(x) {
                this.x = x;
                this.y = GROUND_Y;
                this.vx = 0;
                this.vy = 0;
                this.isGrounded = true;
                this.touches = 0;
            }

            update(ball) {
                if (this.isAI) {
                    this.updateAI(ball);
                } else {
                    this.updateControls();
                }

                // Aplica Gravidade
                this.vy += 0.6;
                this.x += this.vx;
                this.y += this.vy;

                // Colisão com o Chão
                if (this.y >= GROUND_Y) {
                    this.y = GROUND_Y;
                    this.vy = 0;
                    this.isGrounded = true;
                } else {
                    this.isGrounded = false;
                }

                // Limites de Campo
                const isLeftPlayer = this.startX < NET_X;
                if (isLeftPlayer) {
                    if (this.x - this.radius < 0) this.x = this.radius;
                    if (this.x + this.radius > NET_X - 8) this.x = NET_X - 8 - this.radius;
                } else {
                    if (this.x - this.radius < NET_X + 8) this.x = NET_X + 8 + this.radius;
                    if (this.x + this.radius > GAME_WIDTH) this.x = GAME_WIDTH - this.radius;
                }
            }

            updateControls() {
                this.vx = 0;
                if (keys[this.controls.left]) this.vx = -this.speed;
                if (keys[this.controls.right]) this.vx = this.speed;

                if (keys[this.controls.jump] && this.isGrounded) {
                    this.vy = this.jumpForce;
                    this.isGrounded = false;
                }
            }

            updateAI(ball) {
                this.vx = 0;
                
                // Inteligência Artificial Simples
                const ballTargetX = ball.x;
                const distanceToBall = ballTargetX - this.x;

                // A IA só reage se a bola estiver do seu lado ou a vir para o seu lado
                if (ball.x > NET_X - 100 || ball.vx > 0) {
                    // Posição ideal para defender/atacar
                    let targetX = ball.x;
                    
                    // Se a bola estiver muito alta perto da rede, ajusta posição para rematar
                    if (ball.y < GROUND_Y - 150 && ball.x > NET_X + 50) {
                        targetX = ball.x - 20;
                    }

                    if (Math.abs(distanceToBall) > 10) {
                        if (distanceToBall > 0) {
                            this.vx = this.speed * 0.85;
                        } else {
                            this.vx = -this.speed * 0.85;
                        }
                    }

                    // Decisão de Salto
                    const shouldJump = (
                        Math.abs(distanceToBall) < 40 &&
                        ball.y < GROUND_Y - 80 &&
                        ball.y > GROUND_Y - 200 &&
                        this.isGrounded
                    );

                    if (shouldJump) {
                        this.vy = this.jumpForce;
                        this.isGrounded = false;
                    }
                } else {
                    // Voltar para o centro da sua área se a bola estiver longe
                    const homeX = GAME_WIDTH * 0.75;
                    if (Math.abs(this.x - homeX) > 20) {
                        this.vx = (this.x < homeX) ? this.speed * 0.5 : -this.speed * 0.5;
                    }
                }
            }

            draw() {
                // Sombra
                ctx.beginPath();
                ctx.ellipse(this.x, GROUND_Y + 5, this.radius, this.radius * 0.3, 0, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
                ctx.fill();

                // Corpo
                ctx.beginPath();
                ctx.arc(this.x, this.y - this.radius, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#ffffff';
                ctx.stroke();

                // Olhos
                ctx.beginPath();
                ctx.arc(this.x + this.eyeOffset, this.y - this.radius - 5, 4, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.fill();
                ctx.beginPath();
                ctx.arc(this.x + this.eyeOffset + (this.eyeOffset > 0 ? 1 : -1), this.y - this.radius - 5, 2, 0, Math.PI * 2);
                ctx.fillStyle = '#000000';
                ctx.fill();
            }
        }

        // Classe Bola
        class Ball {
            constructor() {
                this.radius = 16;
                this.reset(1);
            }

            reset(servingPlayer) {
                this.x = servingPlayer === 1 ? GAME_WIDTH * 0.25 : GAME_WIDTH * 0.75;
                this.y = GROUND_Y - 200;
                this.vx = 0;
                this.vy = 0;
                this.rotation = 0;
                this.lastTouch = null;
            }

            update() {
                this.vy += 0.45; // Gravidade da bola
                this.x += this.vx;
                this.y += this.vy;

                this.rotation += this.vx * 0.05;

                // Resistência do ar ligeira
                this.vx *= 0.995;

                // Paredes Laterais
                if (this.x - this.radius < 0) {
                    this.x = this.radius;
                    this.vx *= -0.7;
                }
                if (this.x + this.radius > GAME_WIDTH) {
                    this.x = GAME_WIDTH - this.radius;
                    this.vx *= -0.7;
                }

                // Teto
                if (this.y - this.radius < 0) {
                    this.y = this.radius;
                    this.vy *= -0.5;
                }

                // Colisão com a Rede
                const netLeft = NET_X - 6;
                const netRight = NET_X + 6;

                if (this.y + this.radius > NET_TOP) {
                    // Colisão Lateral da Rede
                    if (this.x + this.radius > netLeft && this.x - this.radius < netRight) {
                        if (this.x < NET_X) {
                            this.x = netLeft - this.radius;
                            this.vx = -Math.abs(this.vx) * 0.6;
                        } else {
                            this.x = netRight + this.radius;
                            this.vx = Math.abs(this.vx) * 0.6;
                        }
                    }
                } else if (this.y + this.radius > NET_TOP - 10 && Math.abs(this.x - NET_X) < 10) {
                    // Bordo Superior da Rede
                    this.vy *= -0.6;
                }
            }

            draw() {
                // Sombra no chão
                const shadowScale = Math.max(0.2, 1 - (GROUND_Y - this.y) / 400);
                ctx.beginPath();
                ctx.ellipse(this.x, GROUND_Y + 5, this.radius * shadowScale, (this.radius * 0.3) * shadowScale, 0, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
                ctx.fill();

                // Desenho da Bola (Vólei)
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);

                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#f39c12';
                ctx.fill();

                // Riscas de vólei
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 3;
                
                ctx.beginPath();
                ctx.arc(0, 0, this.radius, -Math.PI / 4, Math.PI / 4);
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(0, 0, this.radius, (3 * Math.PI) / 4, (5 * Math.PI) / 4);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(-this.radius, 0);
                ctx.lineTo(this.radius, 0);
                ctx.stroke();

                ctx.restore();
            }
        }

        // Criar Objetos
        const player1 = new Player(200, '#e74c3c', false, {
            left: 'KeyA',
            right: 'KeyD',
            jump: 'KeyW',
            smash: 'KeyS'
        });

        let player2 = new Player(700, '#3498db', true, {
            left: 'ArrowLeft',
            right: 'ArrowRight',
            jump: 'ArrowUp',
            smash: 'ArrowDown'
        });

        const ball = new Ball();

        // Criar Partículas (Efeitos ao rematar)
        function createParticles(x, y, color) {
            for (let i = 0; i < 12; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8,
                    radius: Math.random() * 4 + 2,
                    color: color,
                    alpha: 1
                });
            }
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.03;
                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                }
            }
        }

        function drawParticles() {
            particles.forEach(p => {
                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.fill();
                ctx.restore();
            });
        }

        // Verificação de Colisão entre Jogador e Bola
        function checkPlayerBallCollision(player, isPlayer1) {
            const dx = ball.x - player.x;
            const dy = ball.y - (player.y - player.radius);
            const distance = Math.sqrt(dx * dx + dy * dy);

            if (distance < ball.radius + player.radius) {
                // Jogador tocou na bola
                ball.lastTouch = isPlayer1 ? 1 : 2;

                // Reorientar a bola com base no ponto de contacto
                const angle = Math.atan2(dy, dx);
                let speed = 11;

                // Remate Forte (Smash)
                const isSmashKey = isPlayer1 ? keys['KeyS'] : keys['ArrowDown'];
                if (isSmashKey || (!player.isGrounded && Math.random() < 0.3 && player.isAI)) {
                    speed = 16;
                    createParticles(ball.x, ball.y, '#ffcc00');
                }

                // Ajuste de ângulo para garantir que a bola vai para cima
                let targetAngle = angle;
                if (targetAngle > -0.2 && targetAngle < Math.PI) {
                    targetAngle = -Math.PI / 3; // Direciona para cima/frente se bater por cima sem remate
                }

                ball.vx = Math.cos(targetAngle) * speed;
                ball.vy = Math.sin(targetAngle) * speed;

                // Evita que a bola fique presa dentro do jogador
                const overlap = (ball.radius + player.radius) - distance;
                ball.x += Math.cos(angle) * overlap;
                ball.y += Math.sin(angle) * overlap;
            }
        }

        // Lógica de Pontuação
        function checkPoint() {
            if (ball.y + ball.radius >= GROUND_Y) {
                // A bola tocou no chão
                createParticles(ball.x, GROUND_Y, '#f1c40f');

                if (ball.x < NET_X) {
                    // Ponto para o Jogador 2
                    p2Score++;
                    servingPlayer = 1; // Ponto da P2, P1 serve a seguir
                } else {
                    // Ponto para o Jogador 1
                    p1Score++;
                    servingPlayer = 2; // Ponto da P1, P2 serve a seguir
                }

                updateUI();

                // Verificar Fim de Jogo
                if (p1Score >= WINNING_SCORE || p2Score >= WINNING_SCORE) {
                    endGame();
                } else {
                    resetRound();
                }
            }
        }

        function resetRound() {
            player1.reset(200);
            player2.reset(700);
            ball.reset(servingPlayer);
        }

        function updateUI() {
            p1ScoreEl.textContent = p1Score;
            p2ScoreEl.textContent = p2Score;
        }

        function startGame(mode) {
            gameMode = mode;
            p1Score = 0;
            p2Score = 0;
            servingPlayer = 1;
            updateUI();

            player2 = new Player(700, '#3498db', gameMode === '1P', {
                left: 'ArrowLeft',
                right: 'ArrowRight',
                jump: 'ArrowUp',
                smash: 'ArrowDown'
            });

            p2NameEl.textContent = gameMode === '1P' ? 'CPU' : 'Jogador 2';

            mainMenu.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            gameState = 'PLAYING';
            resetRound();
        }

        function endGame() {
            gameState = 'GAMEOVER';
            let winnerText = '';
            if (p1Score > p2Score) {
                winnerText = 'Jogador 1 Venceu!';
            } else {
                winnerText = gameMode === '1P' ? 'A CPU Venceu!' : 'Jogador 2 Venceu!';
            }
            winnerTitle.textContent = winnerText;
            gameOverScreen.classList.remove('hidden');
        }

        // Desenho do Cenário
        function drawEnvironment() {
            // Céu Degradê
            const skyGradient = ctx.createLinearGradient(0, 0, 0, GAME_HEIGHT);
            skyGradient.addColorStop(0, '#4a90e2');
            skyGradient.addColorStop(0.7, '#50e3c2');
            skyGradient.addColorStop(1, '#f5a623');
            ctx.fillStyle = skyGradient;
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            // Sol
            ctx.beginPath();
            ctx.arc(GAME_WIDTH / 2, 90, 45, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 255, 200, 0.8)';
            ctx.fill();

            // Areia / Chão
            ctx.fillStyle = '#e67e22';
            ctx.fillRect(0, GROUND_Y, GAME_WIDTH, GAME_HEIGHT - GROUND_Y);

            // Camada de areia mais clara por cima
            ctx.fillStyle = '#f1c40f';
            ctx.fillRect(0, GROUND_Y, GAME_WIDTH, 12);

            // Rede
            ctx.fillStyle = '#ecf0f1';
            ctx.fillRect(NET_X - 4, NET_TOP, 8, NET_HEIGHT);

            // Postes da rede
            ctx.fillStyle = '#7f8c8d';
            ctx.fillRect(NET_X - 6, NET_TOP, 12, 8);
            ctx.fillRect(NET_X - 6, GROUND_Y - 5, 12, 5);

            // Linha da Rede (Detalhes)
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.15)';
            ctx.lineWidth = 2;
            for (let y = NET_TOP + 10; y < GROUND_Y; y += 12) {
                ctx.beginPath();
                ctx.moveTo(NET_X - 4, y);
                ctx.lineTo(NET_X + 4, y);
                ctx.stroke();
            }
        }

        // Ciclo Principal do Jogo (Game Loop)
        function gameLoop() {
            ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            drawEnvironment();

            if (gameState === 'PLAYING') {
                // Atualizações
                player1.update(ball);
                player2.update(ball);
                ball.update();

                checkPlayerBallCollision(player1, true);
                checkPlayerBallCollision(player2, false);
                checkPoint();
                updateParticles();
            }

            // Desenhar Entidades
            player1.draw();
            player2.draw();
            ball.draw();
            drawParticles();

            requestAnimationFrame(gameLoop);
        }

        // Eventos dos Botões
        document.getElementById('btn-1p').addEventListener('click', () => startGame('1P'));
        document.getElementById('btn-2p').addEventListener('click', () => startGame('2P'));
        document.getElementById('btn-restart').addEventListener('click', () => startGame(gameMode));
        document.getElementById('btn-menu').addEventListener('click', () => {
            gameOverScreen.classList.add('hidden');
            mainMenu.classList.remove('hidden');
            gameState = 'MENU';
        });

        // Iniciar o Loop
        window.onload = function() {
            gameLoop();
        };
    </script>
</body>
</html>
